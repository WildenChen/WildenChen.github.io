<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-Hant' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="{{ page.robots | default: 'noindex,nofollow' }}">
  <meta name="theme-color" content="#163b3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wilden Hub">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/icons/icon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/icons/icon-192.png' | relative_url }}">
  <title>{{ page.title | default: site.title }} | Wilden Hub</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/portal.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="portal-shell navbar">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Wilden Hub home">
        <span class="brand-mark">W</span>
        <span>Wilden Hub</span>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="{{ '/dashboard/' | relative_url }}">Dashboard</a>
        <a href="{{ '/ai-tools/' | relative_url }}">AI Tools</a>
        <a href="{{ '/openclaw/' | relative_url }}">OpenClaw</a>
        <a href="{{ '/knowledge-base/' | relative_url }}">Knowledge Base</a>
        <a href="{{ '/legacy/' | relative_url }}">Swift Archive</a>
        <a href="https://github.com/WildenChen" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>
  {{ content }}
  <script src="{{ '/assets/js/pwa.js' | relative_url }}" defer></script>
</body>
</html>
