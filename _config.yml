title: Wilden Hub
description: Wilden 的 HomeLab、AI 工具、OpenClaw 與 Swift Archive。
lang: zh-Hant
timezone: Asia/Taipei
url: "https://wildenchen.github.io"
baseurl: ""
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
include:
  - SUMMARY.md
defaults:
  - scope:
      path: "swift-road/chapter*"
    values:
      layout: legacy_article
      article_section: Swift 殿堂之路
      robots: noindex,nofollow
  - scope:
      path: "swift-design-patterns"
    values:
      layout: legacy_article
      article_section: 實作 Swift 設計模式
      robots: noindex,nofollow
  - scope:
      path: "swift-road/SUMMARY.md"
    values:
      layout: legacy_article
      article_section: Swift 殿堂之路
      robots: noindex,nofollow
  - scope:
      path: "swift-road/swift.md"
    values:
      layout: legacy_article
      article_section: Swift 殿堂之路
      robots: noindex,nofollow
exclude:
  - scripts/
  - docs/
