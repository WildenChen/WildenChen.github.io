<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0a0e17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="弘儒控制台">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <title>弘儒個人控制台</title>
  <meta name="description" content="AI 工具、Agent、訂閱、自架服務、書籍與專案的個人管理入口。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0e17;
      --surface: #131b2e;
      --surface-alt: #1a2340;
      --border: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 255, 255, 0.14);
      --text: #e8edf5;
      --muted: #8899b4;
      --faint: #5a6b85;
      --accent: #2dd4bf;
      --accent-glow: rgba(45, 212, 191, 0.25);
      --sky: #38bdf8;
      --gold: #f8d66d;
      --rose: #f43f5e;
      --purple: #8b5cf6;
      --green: #22c55e;
      --amber: #f59e0b;
      --indigo: #6366f1;
      --pink: #ec4899;
      --blue: #3b82f6;
      --max-width: 1120px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { min-height: 100%; background: var(--bg); scroll-behavior: smooth; }

    body {
      min-height: 100%;
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      color: var(--text);
      background: var(--bg);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: inherit; transition: all 0.2s ease; }

    h1, h2, h3, h4, .brand, .section-label, .tab-btn {
      font-family: 'Outfit', sans-serif;
      letter-spacing: -0.02em;
    }

    h1, h2, h3, p { margin-top: 0; }

    .shell { width: min(100% - 32px, var(--max-width)); margin: 0 auto; }

    .site-header {
      position: sticky; top: 0; z-index: 50;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 14, 23, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .navbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 18px; padding: 12px 0;
    }

    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      color: var(--text); font-size: 1.05rem; font-weight: 700;
      text-decoration: none; white-space: nowrap;
    }

    .brand-mark {
      display: grid; width: 32px; height: 32px; place-items: center;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--sky));
      color: #fff; font-family: 'Outfit', sans-serif;
      font-size: 0.85rem; font-weight: 800;
    }

    .nav-links {
      display: flex; align-items: center; gap: 4px;
      overflow-x: auto; scrollbar-width: none;
    }

    .nav-links::-webkit-scrollbar { display: none; }

    .nav-links a {
      padding: 8px 12px; border-radius: 8px;
      color: var(--muted); font-size: 0.82rem;
      font-weight: 500; text-decoration: none; white-space: nowrap;
      transition: all 0.2s ease;
    }

    .nav-links a:hover { color: var(--text); background: rgba(255,255,255,0.05); }

    .nav-toggle {
      display: none; flex-direction: column; justify-content: center;
      gap: 5px; width: 40px; height: 40px; padding: 10px;
      border: 1px solid var(--border); border-radius: 8px;
      background: rgba(255,255,255,0.04); cursor: pointer;
    }

    .nav-toggle-bar {
      display: block; width: 100%; height: 2px;
      background: var(--muted); border-radius: 2px; transition: all 0.25s;
    }

    .nav-overlay {
      display: none; position: fixed; inset: 0; z-index: -1;
      background: rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.3s;
    }

    main { padding: 0 0 60px; }

    .site-footer {
      padding: 32px 0 48px; color: var(--faint);
      font-size: 0.82rem; text-align: center;
      border-top: 1px solid var(--border);
    }

    .section { padding: 48px 0; }
    .section + .section { border-top: 1px solid var(--border); }

    .section-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    }

    .section-bar {
      width: 3px; height: 24px; border-radius: 2px;
      background: var(--accent); flex-shrink: 0;
    }

    .section-label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--faint);
    }

    .section-title {
      font-size: 1.5rem; font-weight: 700; color: var(--text); margin: 4px 0 0;
    }

    .section-desc {
      color: var(--muted); font-size: 0.92rem;
      line-height: 1.7; margin: 6px 0 0; max-width: 680px;
    }

    .hero {
      padding: 60px 0 40px;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero .subtitle {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      color: var(--muted); font-weight: 500; margin-bottom: 14px;
    }

    .hero .lede {
      color: var(--faint); font-size: 0.9rem;
      line-height: 1.7; max-width: 620px;
    }

    .card {
      border: 1px solid var(--border); border-radius: 12px;
      background: var(--surface); transition: all 0.25s ease;
    }
    .card:hover { border-color: var(--border-hover); background: var(--surface-alt); transform: translateY(-2px); }

    .card-grid { display: grid; gap: 16px; }

    /* ─── Tabs ─── */
    .map-tabs {
      display: flex; gap: 4px; flex-wrap: wrap;
      margin-bottom: 0; border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      position: relative;
      padding: 10px 18px;
      border: none; border-bottom: 2px solid transparent;
      font-size: 0.85rem; font-weight: 600;
      cursor: pointer; background: transparent;
      color: var(--muted); transition: all 0.2s ease;
      margin-bottom: -1px;
    }

    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: var(--accent); border-bottom-color: var(--accent);
    }

    .tab-panel { display: none; padding: 24px 0; }
    .tab-panel.active { display: block; }

    /* ─── View 1: Tasks ─── */
    .task-grid {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;
    }

    .task-btn {
      padding: 10px 18px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--muted); font-size: 0.88rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s ease;
    }

    .task-btn:hover { border-color: var(--border-hover); color: var(--text); }
    .task-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(45,212,191,0.08); }

    .task-detail {
      padding: 24px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface);
      min-height: 120px;
    }

    .task-detail-placeholder {
      color: var(--faint); font-size: 0.9rem;
    }

    .task-choice {
      font-size: 1.15rem; font-weight: 700; color: var(--accent);
      margin-bottom: 12px;
    }

    .task-why {
      color: var(--muted); font-size: 0.9rem; line-height: 1.7; margin-bottom: 12px;
    }

    .task-behind {
      font-size: 0.82rem; color: var(--faint);
    }

    .task-behind strong { color: var(--sky); }

    .task-not-rec {
      margin-top: 10px; padding: 10px 14px;
      border-radius: 8px; background: rgba(244,63,94,0.08);
      border: 1px solid rgba(244,63,94,0.15);
      font-size: 0.82rem; color: var(--rose);
    }

    .task-note {
      margin-top: 10px; padding: 10px 14px;
      border-radius: 8px; background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.15);
      font-size: 0.82rem; color: var(--amber);
    }

    /* ─── View 2: Entries ─── */
    .entry-group { margin-bottom: 28px; }

    .entry-group:last-child { margin-bottom: 0; }

    .entry-group h3 {
      font-size: 0.85rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 14px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .entry-group.main h3 { color: var(--accent); }
    .entry-group.exploring h3 { color: var(--amber); }

    .entry-grid {
      display: grid; gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    }

    .entry-card {
      padding: 18px; cursor: pointer;
    }

    .entry-card-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 8px;
    }

    .entry-category {
      font-size: 0.7rem; font-weight: 600; color: var(--faint);
      letter-spacing: 0.03em;
    }

    .entry-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1rem; font-weight: 700; margin-bottom: 4px;
    }

    .entry-purpose {
      font-size: 0.82rem; color: var(--muted); line-height: 1.5;
    }

    .entry-detail {
      display: none; margin-top: 12px; padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 0.82rem; line-height: 1.6;
    }

    .entry-detail.open { display: block; }

    .entry-detail .row {
      display: flex; gap: 6px; margin-bottom: 6px;
    }

    .entry-detail .row-label {
      color: var(--faint); font-weight: 600; min-width: 60px; flex-shrink: 0;
    }

    .entry-detail .row-value { color: var(--muted); }

    /* ─── View 3: Locations ─── */
    .location-grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(3, 1fr);
    }

    .location-card {
      padding: 22px;
    }

    .location-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1rem; font-weight: 700; margin-bottom: 2px;
    }

    .location-subtitle {
      font-size: 0.78rem; color: var(--faint); margin-bottom: 14px;
    }

    .loc-service {
      padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .loc-service:last-child { border-bottom: none; }

    .loc-service-name {
      font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 6px;
    }

    .loc-service-desc {
      font-size: 0.74rem; color: var(--faint); margin-top: 2px;
    }

    .badge-dual {
      display: inline-flex; align-items: center; padding: 2px 8px;
      border-radius: 8px; font-size: 0.62rem; font-weight: 600;
      background: rgba(139,92,246,0.12); color: var(--purple);
      letter-spacing: 0.02em;
    }

    /* ─── View 4: Subscriptions ─── */
    .sub-grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(3, 1fr);
    }

    .sub-card {
      padding: 22px;
    }

    .sub-card h3 {
      font-size: 0.82rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 14px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .sub-card.paid h3 { color: var(--accent); }
    .sub-card.free h3 { color: var(--sky); }
    .sub-card.self-hosted h3 { color: var(--indigo); }

    .sub-item {
      padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .sub-item:last-child { border-bottom: none; }

    .sub-item-name {
      font-size: 0.88rem; font-weight: 600; display: flex; align-items: center; gap: 6px;
    }

    .sub-item-desc {
      font-size: 0.76rem; color: var(--faint); margin-top: 2px;
    }

    /* ─── View 5: Agent Relations ─── */
    .agent-cards {
      display: grid; gap: 20px;
      grid-template-columns: repeat(2, 1fr); margin-bottom: 28px;
    }

    .agent-card-lg {
      padding: 24px;
      border-left: 3px solid var(--agent-color, var(--accent));
    }

    .agent-card-lg .agent-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem; font-weight: 700; margin-bottom: 14px;
      color: var(--agent-color, var(--text));
    }

    .agent-field {
      margin-bottom: 8px;
    }

    .agent-field-label {
      font-size: 0.68rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--faint); margin-bottom: 2px;
    }

    .agent-field-value {
      font-size: 0.85rem; color: var(--muted); line-height: 1.5;
    }

    .relation-map {
      padding: 24px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface);
    }

    .relation-map h4 {
      font-size: 0.82rem; font-weight: 700; color: var(--faint);
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px;
    }

    .relation-list {
      display: grid; gap: 8px;
    }

    .relation-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.03);
      font-size: 0.85rem;
    }

    .relation-from {
      font-weight: 600; color: var(--text); white-space: nowrap;
    }

    .relation-arrow {
      color: var(--faint); flex-shrink: 0;
    }

    .relation-label {
      font-size: 0.7rem; color: var(--faint);
      padding: 2px 8px; border-radius: 6px;
      background: rgba(255,255,255,0.05); flex-shrink: 0;
    }

    .relation-to {
      color: var(--muted); white-space: nowrap;
    }

    /* ─── View 6: Fuel Tree ─── */
    .fuel-grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    }

    .fuel-card {
      padding: 22px;
    }

    .fuel-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1rem; font-weight: 700; margin-bottom: 4px;
      color: var(--sky);
    }

    .fuel-type {
      font-size: 0.72rem; font-weight: 600; color: var(--faint);
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px;
    }

    .fuel-desc {
      font-size: 0.82rem; color: var(--muted); line-height: 1.5; margin-bottom: 12px;
    }

    .fuel-children {
      display: flex; flex-direction: column; gap: 4px;
    }

    .fuel-child {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.03);
      font-size: 0.82rem; color: var(--muted);
    }

    .fuel-child::before {
      content: '└─';
      color: var(--faint); font-size: 0.7rem;
    }

    /* ─── Search ─── */
    .search-bar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 20px;
    }

    .search-input {
      flex: 1; max-width: 360px;
      padding: 10px 16px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font-size: 0.88rem;
      outline: none; transition: border-color 0.2s ease;
    }

    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--faint); }

    .search-hint {
      font-size: 0.78rem; color: var(--faint);
    }

    /* ─── Badges ─── */
    .badge {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 12px;
      font-size: 0.68rem; font-weight: 600; letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .badge-green { background: rgba(34,197,94,0.12); color: var(--green); }
    .badge-amber { background: rgba(245,158,11,0.12); color: var(--amber); }
    .badge-purple { background: rgba(139,92,246,0.12); color: var(--purple); }
    .badge-rose { background: rgba(244,63,94,0.12); color: var(--rose); }
    .badge-gray { background: rgba(255,255,255,0.06); color: var(--faint); }
    .badge-accent { background: rgba(45,212,191,0.1); color: var(--accent); }

    .btn {
      display: inline-flex; align-items: center;
      padding: 6px 14px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 0.78rem; font-weight: 600;
      text-decoration: none; transition: all 0.2s ease;
      background: rgba(255,255,255,0.04);
    }
    .btn:hover { border-color: var(--border-hover); background: rgba(255,255,255,0.08); }
    .btn-primary { border-color: var(--accent); color: var(--accent); background: rgba(45,212,191,0.08); }
    .btn-primary:hover { background: rgba(45,212,191,0.16); }
    .btn-todo { opacity: 0.4; cursor: not-allowed; }

    /* ─── Books & Projects ─── */
    .book-grid { grid-template-columns: repeat(2, 1fr); }

    .book-card {
      padding: 24px; display: flex; flex-direction: column;
    }

    .book-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem; font-weight: 700; margin-bottom: 8px;
    }

    .book-desc {
      font-size: 0.82rem; color: var(--muted);
      line-height: 1.6; margin-bottom: 16px; flex: 1;
    }

    .book-actions {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto;
    }

    .project-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

    .project-card {
      padding: 24px; display: flex; flex-direction: column;
    }

    .project-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 6px;
    }

    .project-name {
      font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 700;
    }

    .project-purpose {
      font-size: 0.82rem; color: var(--muted);
      line-height: 1.6; margin-bottom: 12px; flex: 1;
    }

    .project-meta {
      display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;
    }

    .link-group {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto;
    }

    /* ─── Responsive ─── */

    @media (max-width: 940px) {
      .location-grid, .sub-grid, .agent-cards {
        grid-template-columns: 1fr;
      }
      .book-grid { grid-template-columns: 1fr; }
      .entry-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 680px) {
      .shell { width: min(100% - 24px, var(--max-width)); }

      .navbar {
        align-items: stretch; flex-direction: column; gap: 10px; padding: 14px 0;
      }

      .nav-toggle { display: flex; align-self: flex-end; }

      .nav-links {
        display: none; flex-direction: column; gap: 2px; padding: 8px 0;
      }

      .nav-links.is-open { display: flex; }
      .nav-overlay.is-visible { display: block; opacity: 1; }

      .nav-links a { padding: 12px; border-radius: 8px; }

      .section { padding: 32px 0; }
      .hero { padding: 36px 0 28px; }

      .tab-btn { font-size: 0.78rem; padding: 8px 12px; }
      .task-grid { gap: 6px; }
      .task-btn { font-size: 0.82rem; padding: 8px 14px; }

      .fuel-grid { grid-template-columns: 1fr; }
      .project-grid { grid-template-columns: 1fr; }

      .relation-item {
        flex-wrap: wrap; gap: 6px;
      }

      /* ─── Arch: responsive ─── */
      .arch-layers { gap: 6px; }
      .arch-layer { padding: 10px 12px; }
      .arch-layer-label { font-size: 0.65rem; }
      .arch-nodes { gap: 4px; }
      .arch-node { font-size: 0.7rem; padding: 4px 8px; }
      .arch-entry-grid { grid-template-columns: 1fr; }
      .arch-agent-flow { grid-template-columns: 1fr; }
      .arch-fuel-grid { grid-template-columns: 1fr; }
      .arch-deploy-grid { grid-template-columns: 1fr; }
      .arch-km-grid { grid-template-columns: 1fr; }
      .arch-detail { width: 100%; right: 0; }
      .arch-filter-wrap { gap: 4px; }
      .arch-filter-pill { font-size: 0.65rem; padding: 3px 8px; }
    }

    /* ─── AI OS Architecture Explorer ─── */
    .arch-hero {
      position: relative;
      padding: 12px 16px; margin-bottom: 28px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(45,212,191,0.06), rgba(99,102,241,0.06));
      border: 1px solid rgba(255,255,255,0.06);
      overflow: hidden;
    }
    .arch-hero::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 60% at 30% 40%, rgba(45,212,191,0.06), transparent);
      pointer-events: none;
    }
    .arch-hero-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.3rem; font-weight: 800; margin-bottom: 6px;
      letter-spacing: -0.02em;
    }
    .arch-hero-desc { font-size: 0.88rem; color: var(--muted); line-height: 1.6; position: relative; }

    /* ─── Arch Tabs ─── */
    .arch-tabs {
      display: flex; gap: 3px; flex-wrap: wrap;
      margin-bottom: 0; border-bottom: 1px solid var(--border);
    }
    .arch-tab {
      padding: 9px 16px;
      border: none; border-bottom: 2px solid transparent;
      font-size: 0.82rem; font-weight: 600;
      cursor: pointer; background: transparent;
      color: var(--faint); transition: all 0.2s ease;
      margin-bottom: -1px; white-space: nowrap;
    }
    .arch-tab:hover { color: var(--text); }
    .arch-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .arch-panel { display: none; padding: 20px 0; }
    .arch-panel.active { display: block; }

    /* ─── Arch search & filter ─── */
    .arch-toolbar {
      display: flex; align-items: center; flex-wrap: wrap;
      gap: 10px; margin-bottom: 16px;
    }
    .arch-search {
      flex: 1; min-width: 180px; max-width: 320px;
      padding: 8px 14px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font-size: 0.85rem;
      outline: none; transition: border-color 0.2s;
    }
    .arch-search:focus { border-color: var(--accent); }
    .arch-search::placeholder { color: var(--faint); }
    .arch-filter-wrap {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .arch-filter-pill {
      padding: 4px 12px; border-radius: 20px;
      border: 1px solid var(--border);
      font-size: 0.72rem; font-weight: 500;
      cursor: pointer; background: transparent;
      color: var(--faint); transition: all 0.2s;
    }
    .arch-filter-pill:hover { border-color: var(--border-hover); color: var(--text); }
    .arch-filter-pill.active {
      border-color: var(--accent); color: var(--accent);
      background: rgba(45,212,191,0.08);
    }

    /* ─── Detail Panel ─── */
    .arch-detail-overlay {
      display: none; position: fixed; inset: 0; z-index: 90;
      background: rgba(0,0,0,0.4);
    }
    .arch-detail-overlay.open { display: block; }
    .arch-detail {
      position: fixed; top: 0; right: -440px; width: 420px; max-width: 90vw;
      height: 100%; z-index: 100; overflow-y: auto;
      background: var(--surface); border-left: 1px solid var(--border);
      padding: 28px 24px; transition: right 0.3s ease;
    }
    .arch-detail.open { right: 0; }
    .arch-detail-close {
      position: absolute; top: 14px; right: 16px;
      width: 32px; height: 32px; border-radius: 50%;
      border: 1px solid var(--border); background: transparent;
      color: var(--faint); font-size: 1.2rem; cursor: pointer;
      display: grid; place-items: center; transition: all 0.2s;
    }
    .arch-detail-close:hover { border-color: var(--border-hover); color: var(--text); }
    .arch-detail-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; padding-right: 32px;
    }
    .arch-detail-desc {
      font-size: 0.88rem; color: var(--muted); line-height: 1.7; margin-bottom: 16px;
    }
    .arch-detail-row {
      display: flex; gap: 8px; margin-bottom: 8px; font-size: 0.82rem;
    }
    .arch-detail-label {
      color: var(--faint); font-weight: 600; min-width: 68px; flex-shrink: 0;
    }
    .arch-detail-value { color: var(--muted); }
    .arch-detail-tags {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px;
    }
    .arch-detail-tag {
      padding: 2px 10px; border-radius: 12px;
      font-size: 0.68rem; font-weight: 600;
      background: rgba(255,255,255,0.06); color: var(--faint);
    }
    .arch-detail-notes {
      margin-top: 14px; padding: 12px 14px; border-radius: 10px;
      background: rgba(255,255,255,0.03); font-size: 0.8rem; color: var(--faint);
      line-height: 1.6;
    }
    .arch-detail-notes::before { content: '備註'; display: block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--faint); margin-bottom: 6px; }

    /* ─── View: Layer Diagram ─── */
    .arch-layers {
      display: flex; flex-direction: column; gap: 8px;
    }
    .arch-layer {
      padding: 14px 18px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface);
      transition: all 0.2s;
    }
    .arch-layer:hover { border-color: var(--border-hover); }
    .arch-layer-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    }
    .arch-layer-bar {
      width: 3px; height: 18px; border-radius: 2px; flex-shrink: 0;
    }
    .arch-layer-label {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--faint);
    }
    .arch-layer-arrow {
      text-align: center; font-size: 0.7rem; color: var(--faint);
      padding: 2px 0;
    }
    .arch-nodes {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .arch-node {
      padding: 6px 14px; border-radius: 8px;
      font-size: 0.78rem; font-weight: 500;
      border: 1px solid transparent; cursor: pointer;
      transition: all 0.2s; user-select: none;
    }
    .arch-node:hover { transform: translateY(-1px); }
    .arch-node.selected { border-color: currentColor; box-shadow: 0 0 0 1px currentColor; }
    .arch-node-type-person { background: rgba(45,212,191,0.1); color: var(--accent); border-color: rgba(45,212,191,0.2); }
    .arch-node-type-entry { background: rgba(56,189,248,0.1); color: var(--sky); border-color: rgba(56,189,248,0.2); }
    .arch-node-type-agent { background: rgba(139,92,246,0.1); color: var(--purple); border-color: rgba(139,92,246,0.2); }
    .arch-node-type-engine { background: rgba(248,214,109,0.1); color: var(--gold); border-color: rgba(248,214,109,0.2); }
    .arch-node-type-fuel { background: rgba(244,63,94,0.1); color: var(--rose); border-color: rgba(244,63,94,0.2); }
    .arch-node-type-knowledge { background: rgba(34,197,94,0.1); color: var(--green); border-color: rgba(34,197,94,0.2); }
    .arch-node-type-media { background: rgba(236,72,153,0.1); color: var(--pink); border-color: rgba(236,72,153,0.2); }
    .arch-node-type-infra { background: rgba(99,102,241,0.1); color: var(--indigo); border-color: rgba(99,102,241,0.2); }
    .arch-node-s { font-size: 0.65rem; color: var(--faint); margin-left: 4px; }

    /* ─── View: Entries ─── */
    .arch-entry-grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    }
    .arch-entry-card {
      padding: 18px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface);
      cursor: pointer; transition: all 0.2s;
    }
    .arch-entry-card:hover { border-color: var(--border-hover); background: var(--surface-alt); }
    .arch-entry-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1rem; font-weight: 700; margin-bottom: 4px;
    }
    .arch-entry-desc { font-size: 0.82rem; color: var(--muted); line-height: 1.5; margin-bottom: 10px; }
    .arch-entry-links {
      display: flex; flex-direction: column; gap: 4px;
      font-size: 0.78rem;
    }
    .arch-entry-link {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 8px; border-radius: 6px;
      background: rgba(255,255,255,0.03);
    }
    .arch-entry-link-arrow { color: var(--faint); }
    .arch-entry-link-label { color: var(--sky); }
    .arch-entry-link-dest { color: var(--muted); }

    /* ─── View: Agent Flow ─── */
    .arch-agent-flow {
      display: grid; gap: 20px;
      grid-template-columns: 1fr 1fr;
    }
    .arch-agent-col {
      padding: 20px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface);
    }
    .arch-agent-col-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem; font-weight: 700; margin-bottom: 14px;
      padding-bottom: 8px; border-bottom: 2px solid;
    }
    .arch-agent-step {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0; font-size: 0.85rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .arch-agent-step:last-child { border-bottom: none; }
    .arch-agent-step-icon {
      width: 22px; height: 22px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 0.65rem; font-weight: 700; flex-shrink: 0;
    }
    .arch-agent-step-text { color: var(--muted); }
    .arch-agent-step-text strong { color: var(--text); }

    /* ─── View: Fuel Pipeline ─── */
    .arch-fuel-grid {
      display: grid; gap: 20px;
      grid-template-columns: repeat(2, 1fr);
    }
    .arch-fuel-group {
      padding: 20px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface);
    }
    .arch-fuel-group h4 {
      font-size: 0.82rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.04em; margin-bottom: 14px;
      padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .arch-fuel-group.paid h4 { color: var(--accent); }
    .arch-fuel-group.free h4 { color: var(--sky); }
    .arch-fuel-item {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.82rem;
    }
    .arch-fuel-item:last-child { border-bottom: none; }
    .arch-fuel-source { font-weight: 600; color: var(--text); white-space: nowrap; }
    .arch-fuel-arrow { color: var(--faint); flex-shrink: 0; font-size: 0.7rem; }
    .arch-fuel-dest { color: var(--muted); flex-wrap: wrap; gap: 2px; }
    .arch-fuel-dest-item { display: inline; }
    .arch-fuel-dest-item + .arch-fuel-dest-item::before { content: ', '; color: var(--faint); }

    /* ─── View: Deployment ─── */
    .arch-deploy-grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(3, 1fr);
    }
    .arch-deploy-col {
      padding: 20px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface);
    }
    .arch-deploy-col h4 {
      font-family: 'Outfit', sans-serif;
      font-size: 1rem; font-weight: 700; margin-bottom: 2px;
    }
    .arch-deploy-sub { font-size: 0.74rem; color: var(--faint); margin-bottom: 14px; }
    .arch-deploy-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.82rem;
    }
    .arch-deploy-item:last-child { border-bottom: none; }
    .arch-deploy-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }
    .arch-deploy-name { color: var(--text); }
    .arch-deploy-desc { font-size: 0.72rem; color: var(--faint); margin-left: auto; }

    /* ─── View: Knowledge & Media ─── */
    .arch-km-grid {
      display: grid; gap: 20px;
      grid-template-columns: 1fr 1fr;
    }
    .arch-km-col {
      padding: 20px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface);
    }
    .arch-km-col h4 {
      font-size: 0.82rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.04em; margin-bottom: 14px;
      padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .arch-km-step {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 0; font-size: 0.82rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .arch-km-step:last-child { border-bottom: none; }
    .arch-km-step-icon {
      width: 20px; font-size: 0.7rem; text-align: center; flex-shrink: 0;
    }

    /* ─── Arch connections (SVG) ─── */
    .arch-connections {
      padding: 20px 0; text-align: center;
    }
    .arch-connections svg {
      max-width: 100%; height: auto;
    }
</head>

  <script>
    (function () {
      var D = CONSOLE_DATA;
      var activeTab = 'task';

      function $(id) { return document.getElementById(id); }
      function make(tag, cls, text) {
        var el = document.createElement(tag);
        if (cls) el.className = cls;
        if (text != null) el.textContent = text;
        return el;
      }

      /* ─── Tab System ─── */
      var TAB_KEYS = ['task', 'entry', 'location', 'subscription', 'agent', 'fuel'];
      var TAB_LABELS = ['依任務看', '依入口看', '依部署位置看', '依訂閱狀態看', '依 Agent 關係看', '依幕後燃料看'];

      function renderTabs() {
        var container = $('mapTabs');
        TAB_KEYS.forEach(function (key, i) {
          var btn = make('button', 'tab-btn' + (key === activeTab ? ' active' : ''), TAB_LABELS[i]);
          btn.dataset.tab = key;
          btn.addEventListener('click', function () { switchTab(key); });
          container.appendChild(btn);
        });
      }

      function switchTab(key) {
        activeTab = key;
        $$('.tab-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === key); });
        $$('.tab-panel').forEach(function (p) { p.classList.toggle('active', p.id === 'panel-' + key); });
        filterCurrentView();
      }

      function $$(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }

      /* ─── Search ─── */
      var searchValue = '';

      function filterCurrentView() {
        searchValue = ($('searchInput').value || '').toLowerCase().trim();
        // Re-render current view with filter
        switch (activeTab) {
          case 'task': renderTasks(); break;
          case 'entry': renderEntries(); break;
          case 'location': renderLocations(); break;
          case 'subscription': renderSubscriptions(); break;
          case 'agent': renderAgentRelations(); break;
          case 'fuel': renderFuel(); break;
        }
      }

      function matchesSearch(text) {
        if (!searchValue) return true;
        return (text || '').toLowerCase().indexOf(searchValue) !== -1;
      }

      /* ─── View 1: Tasks ─── */
      var activeTask = null;

      function renderTasks() {
        var grid = $('taskGrid');
        grid.innerHTML = '';
        D.tasks.forEach(function (t) {
          var visible = matchesSearch(t.label) || matchesSearch(t.firstChoice) || matchesSearch(t.why);
          if (!visible) return;
          var btn = make('button', 'task-btn' + (activeTask === t.id ? ' active' : ''), t.label);
          btn.addEventListener('click', function () {
            activeTask = t.id;
            renderTasks();
            showTaskDetail(t);
          });
          grid.appendChild(btn);
        });
        // Re-show detail if active task still exists
        if (activeTask) {
          var found = D.tasks.filter(function (t) { return t.id === activeTask; })[0];
          if (found) showTaskDetail(found);
        }
      }

      function showTaskDetail(t) {
        var detail = $('taskDetail');
        detail.innerHTML = '';

        var choice = make('div', 'task-choice', '第一選擇：' + t.firstChoice);
        detail.appendChild(choice);

        var why = make('div', 'task-why', t.why);
        detail.appendChild(why);

        if (t.behind && t.behind.length) {
          var behind = make('div', 'task-behind');
          behind.innerHTML = '背後：<strong>' + t.behind.join('、') + '</strong>';
          detail.appendChild(behind);
        }

        if (t.notRecommended) {
          var notRec = make('div', 'task-not-rec', '✕ ' + t.notRecommended);
          detail.appendChild(notRec);
        }

        if (t.note) {
          var note = make('div', 'task-note', '→ ' + t.note);
          detail.appendChild(note);
        }
      }

      /* ─── View 2: Entries ─── */
      function renderEntries() {
        var container = $('entryContainer');
        container.innerHTML = '';
        D.entryGroups.forEach(function (g) {
          var filtered = g.items.filter(function (item) {
            return matchesSearch(item.name) || matchesSearch(item.purpose) || matchesSearch(item.category);
          });
          if (!filtered.length) return;

          var group = make('div', 'entry-group' + (g.group === '主力' ? ' main' : ' exploring'));
          group.appendChild(make('h3', '', g.group));

          var grid = make('div', 'entry-grid');
          filtered.forEach(function (item) {
            var card = make('div', 'card entry-card');
            card.dataset.name = item.name;

            var header = make('div', 'entry-card-header');
            header.appendChild(make('span', 'entry-category', item.category));
            header.appendChild(make('span', 'badge badge-gray', item.payment));
            card.appendChild(header);

            card.appendChild(make('div', 'entry-name', item.name));
            card.appendChild(make('div', 'entry-purpose', item.purpose));

            var detail = make('div', 'entry-detail');
            detail.innerHTML =
              '<div class="row"><span class="row-label">背後</span><span class="row-value">' + (item.behind || '-') + '</span></div>' +
              '<div class="row"><span class="row-label">備註</span><span class="row-value">' + (item.note || '-') + '</span></div>';
            card.appendChild(detail);

            card.addEventListener('click', function () {
              detail.classList.toggle('open');
            });

            grid.appendChild(card);
          });
          group.appendChild(grid);
          container.appendChild(group);

        kSteps.forEach(function (s) {
          var step = make('div', 'arch-km-step');
          step.appendChild(make('span', 'arch-km-step-icon', s.icon));
          var text = make('div', '', '');
          text.innerHTML = s.text;
          text.style.cssText = 'color:var(--muted);font-size:0.82rem;line-height:1.5;';
          step.appendChild(text);
          kCol.appendChild(step);
        });
        grid.appendChild(kCol);

        var mCol = make('div', 'arch-km-col');
        mCol.appendChild(make('h4', '', '🎬 媒體管線'));
        var mSteps = [
          { icon: '👩', text: '<strong>語婕</strong> → Agnes 語婕免費 key → 自拍/影片' },
          { icon: '👩‍💻', text: '<strong>筱蜜</strong> → Agnes 筱蜜免費 key → 自拍/影片' },
          { icon: '🎨', text: '<strong>ComfyUI</strong>（M2 Pro 本機）' },
          { icon: '🔧', text: '← OpenCode 腳本操作' },
          { icon: '⚠️', text: '目前主要是 NSFW 試驗，效果不佳，非日常主力' }
        ];
        mSteps.forEach(function (s) {
          var step = make('div', 'arch-km-step');
          step.appendChild(make('span', 'arch-km-step-icon', s.icon));
          var text = make('div', '', '');
          text.innerHTML = s.text;
          text.style.cssText = 'color:var(--muted);font-size:0.82rem;line-height:1.5;';
          step.appendChild(text);
          mCol.appendChild(step);
        });
        grid.appendChild(mCol);

        container.appendChild(grid);
      }

      /* ─── Router ─── */
      function renderArchView(id) {
        switch (id) {
          case 'overview': renderOverview(); break;
          case 'entries': renderEntriesView(); break;
          case 'agent-flow': renderAgentFlow(); break;
          case 'fuel': renderFuelView(); break;
          case 'deployment': renderDeployment(); break;
          case 'knowledge-media': renderKM(); break;
        }
      }

      /* ─── Init ─── */
      document.addEventListener('DOMContentLoaded', function () {
        $('archSearch').addEventListener('input', function () {
          archSearchVal = this.value.toLowerCase().trim();
          renderArchView(activeArchTab);
        });
        $('archDetailClose').addEventListener('click', function () {
          $('archDetail').classList.remove('open');
          $('archDetailOverlay').classList.remove('open');
        });
        $('archDetailOverlay').addEventListener('click', function () {
          $('archDetail').classList.remove('open');
          $('archDetailOverlay').classList.remove('open');
        });
        renderArchTabs();
        renderArchFilters();
        renderArchView(activeArchTab);
      });
    })();
  </script>
  <script src="assets/js/pwa.js" defer></script>
</body>
</html>
