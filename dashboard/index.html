<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#163b3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wilden Hub">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192.png">
  <title>Dashboard | Wilden Hub</title>
  <meta name="description" content="Wilden Hub dashboard with homelab services, AI tools, personal data bookmarks, and link audit status.">
  <link rel="stylesheet" href="../assets/css/portal.css">
</head>
<body>
  <header class="site-header">
    <div class="portal-shell navbar">
      <a class="brand" href="../"><span class="brand-mark">W</span><span>Wilden Hub</span></a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="../swift-road/">Swift 殿堂之路</a>
        <a href="../swift-design-patterns/">Swift 設計模式</a>
        <a href="https://github.com/WildenChen" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="portal-shell page-main">
    <section class="page-hero dashboard-hero">
      <h1>Dashboard</h1>
      <p class="lede">所有部署服務的即時監控與存取控制台。可依據運作狀態與連線需求進行精準檢視與管理。</p>
    </section>

    <section class="status-strip" aria-label="Audit summary">
      <div><span>Total</span><strong id="service-count">--</strong></div>
      <div><span>Reachable</span><strong id="reachable-count">--</strong></div>
      <div><span>Need Review</span><strong id="review-count">--</strong></div>
      <div><span>Updated</span><strong id="audit-date">--</strong></div>
    </section>

    <section class="dashboard-tools" aria-label="Dashboard controls">
      <div class="filter-group" id="status-filters"></div>
    </section>

    <section id="service-catalog" aria-live="polite">
      <div class="notice-panel">
        <h2>系統連線初始化中...</h2>
        <p>正在同步各項服務端點與狀態資料。若載入時間過長，請確認您的網路連線與資料庫狀態。</p>
      </div>
    </section>
  </main>
  <script src="../assets/js/dashboard.js" defer></script>
  <script src="../assets/js/pwa.js" defer></script>
</body>
</html>
